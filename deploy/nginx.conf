# =====================================================================================
# Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#
# 设计要点：前后端同域，前端继续请求 /api、/ws、/banner/xxx.jpg，代码零改动。
# =====================================================================================

upstream backend {
    server backend:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传体积上限：视频 200MB，留些余量
    client_max_body_size 220m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 1. 接口反代：/api/* → 后端（去掉 /api 前缀）----
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 对话可能较慢
    }

    # ---- 2. WebSocket：反馈消息实时推送 ----
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- 3. 静态资源缓存一年（Vite 产物带 hash）----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 4. 上传目录（后端写入、Nginx 读取）----
    # banner / cover / avatar / bg / img / diary / user / video / audio
    location ~ ^/(banner|cover|avatar|bg|img|diary|user|video|audio)/ {
        expires 7d;
        try_files $uri =404;
    }

    # ---- 5. SPA 路由兜底 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
