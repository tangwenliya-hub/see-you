# =====================================================================================
# Nginx 配置（HTTPS 版）—— 小程序体验版上线时启用
#
# 与 nginx.conf 的唯一区别：多了 443 监听 + 80 强制跳转 + 证书挂载。
# 平时的本地/答辩演示仍用 nginx.conf，本文件不影响现状。
#
# 【启用方法】共 3 处改动，见 docs/小程序体验版上线清单.md 第五节：
#   1. deploy/Dockerfile.frontend 里 COPY 的文件名改成 nginx-ssl.conf
#   2. deploy/docker-compose.yml 的 nginx 服务加 443 端口和证书目录挂载
#   3. 把下面所有 YOUR_DOMAIN.com 替换成你的真实域名，证书文件名对应改
# =====================================================================================

upstream backend {
    server backend:8081;
    keepalive 32;
}

# ---- 80：全部跳到 https（微信只认 https；IP 直连调试时把这整段注释掉）----
server {
    listen 80;
    server_name YOUR_DOMAIN.com;

    # 保留 certbot / 云厂商的域名校验路径，避免续期失败
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443：真正干活的地方 ----
server {
    listen 443 ssl;
    http2 on;
    server_name YOUR_DOMAIN.com;

    # 云厂商免费 DV 证书下载的 Nginx 版：.pem 是证书链，.key 是私钥
    ssl_certificate     /etc/nginx/certs/YOUR_DOMAIN.com.pem;
    ssl_certificate_key /etc/nginx/certs/YOUR_DOMAIN.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 上传体积上限：视频 200MB，留些余量
    client_max_body_size 220m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- 1. 接口反代：/api/* → 后端（去掉 /api 前缀）----
    # 小程序 BASE_URL 配成 https://域名/api，所有接口和图片都从这里进来
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 对话可能较慢
    }

    # ---- 2. WebSocket：反馈消息实时推送 ----
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ---- 3. 静态资源缓存一年（Vite 产物带 hash）----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- 4. 上传目录（后端写入、Nginx 读取）----
    location ~ ^/(banner|cover|avatar|bg|img|diary|user|video|audio)/ {
        expires 7d;
        try_files $uri =404;
    }

    # ---- 5. SPA 路由兜底 ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
