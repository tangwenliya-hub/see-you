# =====================================================================================
# Nginx 配置（裸机部署版，后端跑在 127.0.0.1:8081）
# 用法：sudo cp deploy/nginx-standalone.conf /etc/nginx/conf.d/seeyou.conf
#      sudo nginx -t && sudo systemctl reload nginx
# 需把 root 改成实际的前端 dist 路径
# =====================================================================================

upstream backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 220m;

    # ⚠️ 改成实际部署路径：前端 npm run build 之后的 dist 目录
    root /opt/seeyou/frontend/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 接口反代（去掉 /api 前缀）
    location /api/ {
        proxy_pass http://backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket 实时推送
    location /ws {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 上传目录：后端 upload.front-path 指向 dist 目录时，图片直接落在这里
    location ~ ^/(banner|cover|avatar|bg|img|diary|user|video|audio)/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
