<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>绪见</title>
    <style>
      /* 首屏加载页：Vue 挂载后会被 #app 内容替换，自动消失 */
      html, body { margin: 0; padding: 0; height: 100%; }
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 38%, #ffffff 0%, #f2fbf4 55%, #e6f7ea 100%);
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        z-index: 9999;
      }
      .app-boot-stage {
        position: relative;
        width: 260px;
        height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: boot-float 3s ease-in-out infinite;
      }
      .app-boot-stage img {
        width: 200px;
        height: 200px;
        object-fit: contain;
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 12px 20px rgba(76, 175, 80, 0.22));
      }
      .boot-arc {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-bottom-color: rgba(102, 224, 122, 0.6);
        border-top-color: rgba(102, 224, 122, 0.22);
        animation: boot-spin 2.8s linear infinite;
      }
      .boot-orbit {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        animation: boot-spin 4.5s linear infinite;
      }
      .boot-orbit.reverse { inset: 14%; animation: boot-spin-rev 6s linear infinite; }
      .boot-orbit i {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle, #d9ffdf 0%, #66e07a 55%, rgba(102, 224, 122, 0) 100%);
        box-shadow: 0 0 10px 3px rgba(102, 224, 122, 0.5);
      }
      .boot-orbit i:nth-child(1) { top: -3px; left: 50%; transform: translateX(-50%); }
      .boot-orbit i:nth-child(2) { top: 22%; right: -3px; width: 9px; height: 9px; }
      .boot-orbit i:nth-child(3) { bottom: -1px; left: 26%; width: 10px; height: 10px; }
      .boot-orbit i:nth-child(4) { bottom: 22%; left: -1px; width: 7px; height: 7px; }
      .app-boot-text {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 6px;
        background: linear-gradient(90deg, #3fae52, #7ee88e, #3fae52);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: boot-shine 2.2s linear infinite;
      }
      .app-boot-text b { font-weight: 800; }
      .app-boot-text b::after { content: ''; animation: boot-dots 1.5s steps(4, end) infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-spin-rev { to { transform: rotate(-360deg); } }
      @keyframes boot-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes boot-shine { to { background-position: 200% center; } }
      @keyframes boot-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; } }
      @media (max-width: 420px) {
        .app-boot-stage { width: 210px; height: 210px; }
        .app-boot-stage img { width: 165px; height: 165px; }
        .app-boot-text { font-size: 24px; letter-spacing: 4px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot">
        <div class="app-boot-stage">
          <span class="boot-arc"></span>
          <span class="boot-orbit"><i></i><i></i><i></i><i></i></span>
          <span class="boot-orbit reverse"><i></i><i></i><i></i></span>
          <img src="/img/cow加载.png" alt="加载中" />
        </div>
        <div class="app-boot-text">加载中<b></b></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
